<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Count With Me! - Kids Counting Song</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Bubblegum+Sans&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Fredoka One', cursive;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #FFE66D, #FF6B6B);
  transition: background 1s ease;
}

#stage {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

/* Progress Bar */
#progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: 8px;
  background: linear-gradient(90deg, #FF6B6B, #FFE66D, #4ECDC4, #45B7D1, #96E6A1);
  width: 0%;
  z-index: 1000;
  border-radius: 0 4px 4px 0;
  transition: width 0.3s linear;
}

/* Play/Replay Buttons */
.btn {
  font-family: 'Fredoka One', cursive;
  font-size: 2.5rem;
  padding: 20px 50px;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  color: white;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  transition: transform 0.2s, box-shadow 0.2s;
  z-index: 100;
}

.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 12px 35px rgba(0,0,0,0.3);
}

#play-btn {
  background: linear-gradient(135deg, #FF6B6B, #FF8E53);
  animation: pulse 1.5s infinite;
}

#replay-btn {
  background: linear-gradient(135deg, #4ECDC4, #45B7D1);
  display: none;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

/* Scene Container */
.scene {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.scene.active {
  opacity: 1;
  pointer-events: auto;
}

/* Text Styles */
.song-text {
  font-family: 'Fredoka One', cursive;
  font-size: 3rem;
  color: white;
  text-align: center;
  text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
  padding: 20px;
  line-height: 1.4;
  z-index: 10;
}

.song-text.small { font-size: 2rem; }
.song-text.large { font-size: 4.5rem; }
.song-text.huge { font-size: 6rem; }

.highlight {
  color: #FFE66D;
  animation: bounce-text 0.5s ease;
}

@keyframes bounce-text {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

/* Number with face */
.number-face {
  position: relative;
  display: inline-block;
  font-size: 8rem;
  color: #FF6B6B;
  text-shadow: 4px 4px 8px rgba(0,0,0,0.2);
  animation: number-bounce 0.8s ease infinite;
}

@keyframes number-bounce {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-20px) rotate(3deg); }
}

/* Floating Bubbles */
.bubble {
  position: absolute;
  border-radius: 50%;
  opacity: 0.3;
  animation: float-up 6s ease-in-out infinite;
}

@keyframes float-up {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  20% { opacity: 0.3; }
  80% { opacity: 0.3; }
  100% { transform: translateY(-100px) scale(1); opacity: 0; }
}

/* Confetti */
.confetti {
  position: absolute;
  width: 12px;
  height: 12px;
  opacity: 0.9;
  animation: confetti-fall 3s ease-in-out forwards;
}

@keyframes confetti-fall {
  0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* Star Burst */
.starburst {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: starburst-anim 1s ease-out forwards;
}

@keyframes starburst-anim {
  0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(3) rotate(180deg); opacity: 0; }
}

/* Scene transitions */
.zoom-in { animation: zoom-in 0.6s ease forwards; }
@keyframes zoom-in {
  0% { transform: scale(0); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.slide-left { animation: slide-left 0.6s ease forwards; }
@keyframes slide-left {
  0% { transform: translateX(100%); opacity: 0; }
  100% { transform: translateX(0); opacity: 1; }
}

.slide-up { animation: slide-up 0.6s ease forwards; }
@keyframes slide-up {
  0% { transform: translateY(100%); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}

.spin-in { animation: spin-in 0.6s ease forwards; }
@keyframes spin-in {
  0% { transform: rotate(-180deg) scale(0); opacity: 0; }
  100% { transform: rotate(0deg) scale(1); opacity: 1; }
}

/* SVG Character Animations */
@keyframes ray-rotate {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes wing-flap {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-30deg); }
}

@keyframes star-twinkle {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(0.8); opacity: 0.6; }
}

@keyframes frog-jump {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-40px); }
}

@keyframes hand-clap {
  0%, 100% { transform: rotate(0deg) translateX(0); }
  50% { transform: rotate(10deg) translateX(20px); }
}

@keyframes narrator-bob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.sun-character { animation: ray-rotate 8s linear infinite; }
.bird-wing { animation: wing-flap 0.4s ease-in-out infinite; transform-origin: right center; }
.star-character { animation: star-twinkle 1.5s ease-in-out infinite; }
.frog-character { animation: frog-jump 1s ease-in-out infinite; }
.hand-left { animation: hand-clap 0.5s ease-in-out infinite; }
.hand-right { animation: hand-clap 0.5s ease-in-out infinite reverse; }
.narrator-character { animation: narrator-bob 2s ease-in-out infinite; }

/* Call and response styles */
.call-text {
  font-size: 3.5rem;
  color: #FFE66D;
}

.response-text {
  font-size: 4.5rem;
  color: white;
  animation: bounce-text 0.4s ease;
}

/* SVG inline positioning */
.svg-container {
  position: absolute;
  z-index: 5;
}
</style>
</head>
<body>
<div id="progress-bar"></div>
<div id="stage">
  <button id="play-btn" class="btn" onclick="startAnimation()">Play!</button>
  <button id="replay-btn" class="btn" onclick="replay()">Play Again!</button>
</div>

<script>
// SVG Character Definitions
const SVG = {
  sun: (size = 120) => `
    <svg width="${size}" height="${size}" viewBox="0 0 120 120">
      <g class="sun-character">
        <g>
          ${[0,45,90,135,180,225,270,315].map(a => 
            `<rect x="56" y="2" width="8" height="20" rx="4" fill="#FFD93D" transform="rotate(${a} 60 60)"/>`
          ).join('')}
        </g>
      </g>
      <circle cx="60" cy="60" r="35" fill="#FFD93D"/>
      <circle cx="60" cy="60" r="32" fill="#FFEB3B"/>
      <circle cx="48" cy="52" r="5" fill="#333"/>
      <circle cx="72" cy="52" r="5" fill="#333"/>
      <circle cx="49" cy="50" r="2" fill="white"/>
      <circle cx="73" cy="50" r="2" fill="white"/>
      <path d="M 48 70 Q 60 82 72 70" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="38" cy="65" r="5" fill="#FFB3B3" opacity="0.6"/>
      <circle cx="82" cy="65" r="5" fill="#FFB3B3" opacity="0.6"/>
    </svg>`,

  bird: (size = 80, color = '#45B7D1') => `
    <svg width="${size}" height="${size}" viewBox="0 0 80 80">
      <ellipse cx="40" cy="45" rx="18" ry="15" fill="${color}"/>
      <circle cx="40" cy="32" r="12" fill="${color}"/>
      <circle cx="36" cy="30" r="3" fill="#333"/>
      <circle cx="44" cy="30" r="3" fill="#333"/>
      <circle cx="37" cy="29" r="1" fill="white"/>
      <circle cx="45" cy="29" r="1" fill="white"/>
      <polygon points="40,35 37,38 43,38" fill="#FF8C00"/>
      <path class="bird-wing" d="M 22 42 Q 10 35 15 48 Q 20 52 25 45 Z" fill="${color}" opacity="0.8"/>
      <path class="bird-wing" d="M 58 42 Q 70 35 65 48 Q 60 52 55 45 Z" fill="${color}" opacity="0.8" style="transform-origin: left center; animation-delay: 0.2s;"/>
      <path d="M 35 37 Q 40 39 45 37" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </svg>`,

  star: (size = 80) => `
    <svg width="${size}" height="${size}" viewBox="0 0 80 80" class="star-character">
      <polygon points="40,8 48,30 72,30 52,44 60,68 40,54 20,68 28,44 8,30 32,30" fill="#FFD93D" stroke="#FFC107" stroke-width="2"/>
      <circle cx="34" cy="35" r="3" fill="#333"/>
      <circle cx="46" cy="35" r="3" fill="#333"/>
      <circle cx="35" cy="34" r="1" fill="white"/>
      <circle cx="47" cy="34" r="1" fill="white"/>
      <path d="M 35 44 Q 40 50 45 44" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>`,

  frog: (size = 100) => `
    <svg width="${size}" height="${size}" viewBox="0 0 100 100" class="frog-character">
      <ellipse cx="50" cy="65" rx="30" ry="25" fill="#4CAF50"/>
      <circle cx="35" cy="40" r="14" fill="#4CAF50"/>
      <circle cx="65" cy="40" r="14" fill="#4CAF50"/>
      <circle cx="35" cy="38" r="10" fill="white"/>
      <circle cx="65" cy="38" r="10" fill="white"/>
      <circle cx="35" cy="38" r="6" fill="#333"/>
      <circle cx="65" cy="38" r="6" fill="#333"/>
      <circle cx="37" cy="36" r="2" fill="white"/>
      <circle cx="67" cy="36" r="2" fill="white"/>
      <path d="M 38 72 Q 50 82 62 72" stroke="#2E7D32" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="30" cy="85" rx="10" ry="5" fill="#388E3C"/>
      <ellipse cx="70" cy="85" rx="10" ry="5" fill="#388E3C"/>
      <circle cx="30" cy="60" r="4" fill="#FFB3B3" opacity="0.5"/>
      <circle cx="70" cy="60" r="4" fill="#FFB3B3" opacity="0.5"/>
    </svg>`,

  narrator: (size = 150) => `
    <svg width="${size}" height="${size}" viewBox="0 0 150 150" class="narrator-character">
      <circle cx="75" cy="80" r="50" fill="#FF8A65"/>
      <circle cx="75" cy="80" r="46" fill="#FFAB91"/>
      <circle cx="60" cy="72" r="7" fill="#333"/>
      <circle cx="90" cy="72" r="7" fill="#333"/>
      <circle cx="62" cy="70" r="3" fill="white"/>
      <circle cx="92" cy="70" r="3" fill="white"/>
      <path d="M 60 95 Q 75 110 90 95" stroke="#333" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="45" cy="88" r="6" fill="#FF6B6B" opacity="0.5"/>
      <circle cx="105" cy="88" r="6" fill="#FF6B6B" opacity="0.5"/>
      <ellipse cx="75" cy="25" rx="25" ry="12" fill="#FF6B6B" rx="5"/>
      <rect x="60" y="20" width="30" height="18" rx="9" fill="#FF6B6B"/>
      <circle cx="68" cy="28" r="3" fill="#FF8A80"/>
      <circle cx="82" cy="28" r="3" fill="#FF8A80"/>
    </svg>`,

  hands: (size = 200) => `
    <svg width="${size}" height="${size * 0.6}" viewBox="0 0 200 120">
      <g class="hand-left">
        <path d="M 30 80 Q 20 70 25 55 L 30 40 Q 32 35 35 40 L 38 55 L 40 35 Q 42 30 45 35 L 47 55 L 48 32 Q 50 27 53 32 L 54 55 L 55 38 Q 57 33 60 38 L 58 60 Q 56 80 45 85 Z" fill="#FFCC80" stroke="#FF9800" stroke-width="1.5"/>
      </g>
      <g class="hand-right">
        <path d="M 170 80 Q 180 70 175 55 L 170 40 Q 168 35 165 40 L 162 55 L 160 35 Q 158 30 155 35 L 153 55 L 152 32 Q 150 27 147 32 L 146 55 L 145 38 Q 143 33 140 38 L 142 60 Q 144 80 155 85 Z" fill="#FFCC80" stroke="#FF9800" stroke-width="1.5"/>
      </g>
      <g opacity="0.8">
        ${[0,1,2,3,4,5].map(i => {
          const x = 80 + Math.cos(i * 1.05) * 30;
          const y = 50 + Math.sin(i * 1.05) * 20;
          return `<circle cx="${x}" cy="${y}" r="4" fill="${['#FF6B6B','#FFE66D','#4ECDC4','#45B7D1','#96E6A1','#FF8E53'][i]}" opacity="0.8"/>`;
        }).join('')}
      </g>
    </svg>`,

  numberFace: (num, color = '#FF6B6B', size = 120) => `
    <svg width="${size}" height="${size}" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="55" fill="${color}" opacity="0.2"/>
      <text x="60" y="78" text-anchor="middle" font-family="Fredoka One" font-size="70" fill="${color}">${num}</text>
      <circle cx="45" cy="35" r="4" fill="#333"/>
      <circle cx="75" cy="35" r="4" fill="#333"/>
      <circle cx="46" cy="34" r="1.5" fill="white"/>
      <circle cx="76" cy="34" r="1.5" fill="white"/>
    </svg>`
};

// Color themes for backgrounds
const themes = [
  'linear-gradient(135deg, #FFE66D, #FF6B6B)',
  'linear-gradient(135deg, #4ECDC4, #45B7D1)',
  'linear-gradient(135deg, #96E6A1, #4ECDC4)',
  'linear-gradient(135deg, #FF8E53, #FF6B6B)',
  'linear-gradient(135deg, #A8E6CF, #DCEDC1)',
  'linear-gradient(135deg, #FFD93D, #FF6B6B)',
  'linear-gradient(135deg, #45B7D1, #96E6A1)',
  'linear-gradient(135deg, #FF6B6B, #C44569)',
  'linear-gradient(135deg, #DCEDC1, #FFE66D)',
  'linear-gradient(135deg, #4ECDC4, #2C3E50)',
  'linear-gradient(135deg, #FFB3B3, #FF6B6B)',
  'linear-gradient(135deg, #96E6A1, #45B7D1)',
];

const numberColors = ['#FF6B6B','#FF8E53','#FFE66D','#4ECDC4','#45B7D1','#96E6A1','#C44569','#6C5CE7','#A8E6CF','#FF6B6B'];

let currentScene = -1;
let animationTimer = null;
let totalScenes = 0;
let isPlaying = false;

// Scene definitions: { duration (ms), bg (index), content (html), transition }
const scenes = [
  // INTRO
  { duration: 3000, bg: 0, transition: 'zoom-in', content: () => `
    <div class="svg-container" style="top:10%;left:50%;transform:translateX(-50%);">${SVG.narrator(150)}</div>
    <div class="song-text large" style="margin-top: 80px;">Hey, hey!<br>Are you ready?</div>
  `},
  { duration: 3000, bg: 1, transition: 'slide-left', content: () => `
    <div class="song-text large">Let's count together!</div>
    <div class="svg-container" style="bottom:15%;left:20%;">${SVG.star(60)}</div>
    <div class="svg-container" style="bottom:20%;right:20%;">${SVG.star(50)}</div>
  `},
  { duration: 3500, bg: 2, transition: 'spin-in', content: () => `
    <div class="song-text">Clap your hands and<br>stomp your feet--</div>
    <div style="margin-top:20px;">${SVG.hands(220)}</div>
  `},
  { duration: 3000, bg: 3, transition: 'slide-up', content: () => `
    <div class="song-text large">Counting numbers<br>is so sweet!</div>
    <div class="svg-container" style="top:10%;right:10%;">${SVG.sun(100)}</div>
  `},
  // VERSE 1
  { duration: 2500, bg: 4, transition: 'zoom-in', content: () => `
    <div style="display:flex;gap:20px;align-items:center;justify-content:center;">
      ${SVG.numberFace(1, numberColors[0], 110)}
      ${SVG.numberFace(2, numberColors[1], 110)}
      ${SVG.numberFace(3, numberColors[2], 110)}
    </div>
    <div class="song-text" style="margin-top:20px;">One, two, three,<br>Come count with me!</div>
  `},
  { duration: 2500, bg: 5, transition: 'slide-left', content: () => `
    <div style="display:flex;gap:20px;align-items:center;justify-content:center;">
      ${SVG.numberFace(4, numberColors[3], 110)}
      ${SVG.numberFace(5, numberColors[4], 110)}
      ${SVG.numberFace(6, numberColors[5], 110)}
    </div>
    <div class="song-text" style="margin-top:20px;">Four, five, six,<br>Do your counting tricks!</div>
  `},
  { duration: 2500, bg: 6, transition: 'slide-up', content: () => `
    <div style="display:flex;gap:20px;align-items:center;justify-content:center;">
      ${SVG.numberFace(7, numberColors[6], 110)}
      ${SVG.numberFace(8, numberColors[7], 110)}
      ${SVG.numberFace(9, numberColors[8], 110)}
    </div>
    <div class="song-text" style="margin-top:20px;">Seven, eight, nine,<br>We're doing just fine!</div>
  `},
  { duration: 2500, bg: 7, transition: 'spin-in', content: () => `
    <div style="display:flex;gap:10px;align-items:center;justify-content:center;">
      ${SVG.numberFace(10, '#FF6B6B', 130)}
      ${SVG.numberFace(10, '#FFE66D', 130)}
      ${SVG.numberFace(10, '#4ECDC4', 130)}
    </div>
    <div class="song-text large" style="margin-top:10px;">Ten! Ten! Ten!<br>Let's count again!</div>
  `},
  // CHORUS
  { duration: 2500, bg: 8, transition: 'zoom-in', content: () => `
    <div class="song-text large" style="color:#FF6B6B;">1, 2, 3</div>
    <div class="song-text">jump with me!</div>
    <div class="svg-container" style="bottom:10%;left:30%;">${SVG.frog(90)}</div>
    <div class="svg-container" style="bottom:12%;right:30%;">${SVG.frog(80)}</div>
  `},
  { duration: 2500, bg: 9, transition: 'slide-left', content: () => `
    <div class="song-text large" style="color:#FFE66D;">4, 5, 6</div>
    <div class="song-text">do some kicks!</div>
    <div class="svg-container" style="top:10%;left:15%;">${SVG.star(55)}</div>
    <div class="svg-container" style="top:12%;right:15%;">${SVG.star(50)}</div>
  `},
  { duration: 2500, bg: 10, transition: 'slide-up', content: () => `
    <div class="song-text large" style="color:#96E6A1;">7, 8, 9</div>
    <div class="song-text">feeling fine!</div>
    <div class="svg-container" style="bottom:15%;left:20%;">${SVG.bird(70, '#45B7D1')}</div>
    <div class="svg-container" style="bottom:18%;right:20%;">${SVG.bird(65, '#FF8E53')}</div>
  `},
  { duration: 2500, bg: 11, transition: 'spin-in', content: () => `
    <div class="song-text huge" style="color:#FFE66D;">10! 10! 10!</div>
    <div class="song-text">let's do it again!</div>
  `},
  // Chorus continued
  { duration: 3000, bg: 0, transition: 'zoom-in', content: () => `
    <div style="display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;">
      ${[1,2,3,4,5].map(n => SVG.numberFace(n, numberColors[n-1], 80)).join('')}
    </div>
    <div class="song-text" style="margin-top:15px;">One, two, three, four, five!</div>
  `},
  { duration: 3000, bg: 1, transition: 'slide-left', content: () => `
    <div style="display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;">
      ${[6,7,8,9,10].map(n => SVG.numberFace(n, numberColors[n-1], 80)).join('')}
    </div>
    <div class="song-text" style="margin-top:15px;">Six, seven, eight, nine, ten!</div>
  `},
  { duration: 3000, bg: 2, transition: 'slide-up', content: () => `
    <div class="song-text large">Count it loud,<br>count it proud!</div>
    <div class="svg-container" style="top:8%;left:10%;">${SVG.star(50)}</div>
    <div class="svg-container" style="top:10%;right:10%;">${SVG.star(45)}</div>
    <div class="svg-container" style="bottom:10%;left:50%;transform:translateX(-50%);">${SVG.narrator(100)}</div>
  `},
  { duration: 3000, bg: 3, transition: 'spin-in', content: () => `
    <div class="song-text large">Numbers make us<br>happy now!</div>
    <div class="svg-container" style="top:5%;left:50%;transform:translateX(-50%);">${SVG.sun(110)}</div>
  `},
  // VERSE 2
  { duration: 3000, bg: 4, transition: 'zoom-in', content: () => `
    <div style="margin-bottom:15px;">${SVG.sun(140)}</div>
    <div class="song-text">One little sun<br>Shining in the sky!</div>
  `},
  { duration: 3000, bg: 5, transition: 'slide-left', content: () => `
    <div style="display:flex;gap:30px;margin-bottom:15px;">
      ${SVG.bird(90, '#45B7D1')}
      ${SVG.bird(85, '#FF8E53')}
    </div>
    <div class="song-text">Two little birds<br>Flying way up high!</div>
  `},
  { duration: 3000, bg: 6, transition: 'slide-up', content: () => `
    <div style="display:flex;gap:20px;margin-bottom:15px;">
      ${SVG.star(75)}${SVG.star(70)}${SVG.star(65)}
    </div>
    <div class="song-text">Three little stars<br>Twinkling bright!</div>
  `},
  { duration: 3000, bg: 7, transition: 'spin-in', content: () => `
    <div style="display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;justify-content:center;">
      ${SVG.frog(85)}${SVG.frog(80)}${SVG.frog(85)}${SVG.frog(80)}
    </div>
    <div class="song-text">Four little frogs<br>Jumping left and right!</div>
  `},
  // CHORUS 2
  { duration: 2200, bg: 8, transition: 'zoom-in', content: () => `

totalScenes = scenes.length;

function createBubbles(container) {
  const colors = ['#FF6B6B','#FFE66D','#4ECDC4','#45B7D1','#96E6A1','#FF8E53','#C44569','#6C5CE7'];
  for (let i = 0; i < 8; i++) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const size = 20 + Math.random() * 40;
    bubble.style.width = size + 'px';
    bubble.style.height = size + 'px';
    bubble.style.left = Math.random() * 100 + '%';
    bubble.style.background = colors[Math.floor(Math.random() * colors.length)];
    bubble.style.animationDelay = Math.random() * 4 + 's';
    bubble.style.animationDuration = (4 + Math.random() * 4) + 's';
    container.appendChild(bubble);
  }
}

function createConfetti(container) {
  const colors = ['#FF6B6B','#FFE66D','#4ECDC4','#45B7D1','#96E6A1','#FF8E53','#C44569','#6C5CE7'];
  const shapes = ['circle','square','triangle'];
  for (let i = 0; i < 30; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    const shape = shapes[Math.floor(Math.random() * shapes.length)];
    const color = colors[Math.floor(Math.random() * colors.length)];
    const size = 8 + Math.random() * 12;
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.top = '-20px';
    confetti.style.animationDelay = Math.random() * 2 + 's';
    confetti.style.width = size + 'px';
    confetti.style.height = size + 'px';
    confetti.style.background = color;
    
    if (shape === 'circle') {
      confetti.style.borderRadius = '50%';
    } else if (shape === 'triangle') {
      confetti.style.width = '0';
      confetti.style.height = '0';
      confetti.style.background = 'transparent';
      confetti.style.borderLeft = (size/2) + 'px solid transparent';
      confetti.style.borderRight = (size/2) + 'px solid transparent';
      confetti.style.borderBottom = size + 'px solid ' + color;
    }
    
    container.appendChild(confetti);
  }
}

function createStarburst(container) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', '200');
  svg.setAttribute('height', '200');
  svg.setAttribute('viewBox', '0 0 200 200');
  svg.classList.add('starburst');
  svg.style.position = 'absolute';
  svg.style.top = '50%';
  svg.style.left = '50%';
  svg.style.transform = 'translate(-50%,-50%)';
  svg.style.pointerEvents = 'none';
  
  const colors = ['#FFE66D','#FF6B6B','#4ECDC4','#FF8E53','#96E6A1'];
  for (let i = 0; i < 12; i++) {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    const angle = (i * 30) * Math.PI / 180;
    line.setAttribute('x1', '100');
    line.setAttribute('y1', '100');
    line.setAttribute('x2', 100 + Math.cos(angle) * 90);
    line.setAttribute('y2', 100 + Math.sin(angle) * 90);
    line.setAttribute('stroke', colors[i % colors.length]);
    line.setAttribute('stroke-width', '4');
    line.setAttribute('stroke-linecap', 'round');
    svg.appendChild(line);
  }
  
  container.appendChild(svg);
  setTimeout(() => svg.remove(), 1000);
}

function showScene(index) {
  if (index >= totalScenes) {
    endAnimation();
    return;
  }
  
  currentScene = index;
  const scene = scenes[index];
  
  // Update background
  document.body.style.background = themes[scene.bg % themes.length];
  
  // Update progress
  const progress = ((index + 1) / totalScenes) * 100;
  document.getElementById('progress-bar').style.width = progress + '%';
  
  // Clear old scenes
  const oldScenes = document.querySelectorAll('.scene');
  oldScenes.forEach(s => {
    s.classList.remove('active');
    setTimeout(() => s.remove(), 600);
  });
  
  // Create new scene
  const sceneEl = document.createElement('div');
  sceneEl.className = 'scene';
  sceneEl.innerHTML = scene.content();
  
  // Add animation class
  const innerWrapper = document.createElement('div');
  innerWrapper.className = scene.transition;
  innerWrapper.style.display = 'flex';
  innerWrapper.style.flexDirection = 'column';
  innerWrapper.style.alignItems = 'center';
  innerWrapper.style.justifyContent = 'center';
  innerWrapper.style.width = '100%';
  innerWrapper.style.height = '100%';
  innerWrapper.innerHTML = sceneEl.innerHTML;
  sceneEl.innerHTML = '';
  sceneEl.appendChild(innerWrapper);
  
  // Add floating bubbles
  createBubbles(sceneEl);
  
  // Add confetti on special scenes (10s and endings)
  if (index === 7 || index === 11 || index === 30 || index === 33 || index === 40 || index === 41) {
    createConfetti(sceneEl);
    setTimeout(() => createStarburst(sceneEl), 300);
  }
  
  document.getElementById('stage').appendChild(sceneEl);
  
  // Trigger active state
  requestAnimationFrame(() => {
    sceneEl.classList.add('active');
  });
  
  // Schedule next scene
  animationTimer = setTimeout(() => showScene(index + 1), scene.duration);
}

function startAnimation() {
  document.getElementById('play-btn').style.display = 'none';
  document.getElementById('replay-btn').style.display = 'none';
  isPlaying = true;
  showScene(0);
}

function endAnimation() {
  isPlaying = false;
  document.getElementById('progress-bar').style.width = '100%';
  
  // Clear any remaining scenes
  setTimeout(() => {
    const oldScenes = document.querySelectorAll('.scene');
    oldScenes.forEach(s => s.remove());
    
    document.body.style.background = 'linear-gradient(135deg, #96E6A1, #4ECDC4)';
    document.getElementById('replay-btn').style.display = 'block';
  }, 1000);
}

function replay() {
  document.getElementById('replay-btn').style.display = 'none';
  document.getElementById('progress-bar').style.width = '0%';
  currentScene = -1;
  showScene(0);
}
