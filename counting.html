<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Counting Song - 1 to 10!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Bubblegum+Sans&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Fredoka One', cursive;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1a1a2e;
}

#video-container {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

#progress-bar {
  position: absolute;
  top: 0;
  left: 0;
  height: 6px;
  background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcf7f, #4ecdc4, #a855f7);
  z-index: 1000;
  transition: width 0.3s linear;
  border-radius: 0 3px 3px 0;
}

.scene {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 0.5s ease;
  padding: 20px;
}
.scene.active { opacity: 1; }

.scene-text {
  font-family: 'Bubblegum Sans', cursive;
  font-size: clamp(1.5rem, 4vw, 3rem);
  color: white;
  text-align: center;
  text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
  line-height: 1.4;
  z-index: 10;
  position: relative;
}

.scene-text.large {
  font-size: clamp(2rem, 6vw, 4.5rem);
}

.number-display {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(4rem, 12vw, 10rem);
  color: #fff;
  text-shadow: 4px 4px 8px rgba(0,0,0,0.3);
  z-index: 10;
  position: relative;
}

/* Play/Replay Buttons */
#play-btn, #replay-btn {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 2000;
  background: linear-gradient(135deg, #ff6b6b, #ff8e53);
  border: none;
  border-radius: 50%;
  width: 120px; height: 120px;
  cursor: pointer;
  box-shadow: 0 8px 32px rgba(255,107,107,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pulse 1.5s infinite;
}
#play-btn:hover, #replay-btn:hover {
  transform: translate(-50%, -50%) scale(1.1);
}
#replay-btn { display: none; }

@keyframes pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.08); }
}

/* Character Animations */
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}
@keyframes jump {
  0%, 100% { transform: translateY(0); }
  40% { transform: translateY(-40px); }
}
@keyframes wave {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-20deg); }
  75% { transform: rotate(20deg); }
}
@keyframes dance {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  25% { transform: translateX(-10px) rotate(-5deg); }
  75% { transform: translateX(10px) rotate(5deg); }
}
@keyframes clap {
  0%, 100% { transform: scaleX(1); }
  50% { transform: scaleX(0.8); }
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes twinkle {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.7); }
}
@keyframes flap {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-30deg); }
}
@keyframes frogJump {
  0%, 100% { transform: translateY(0) scaleY(1); }
  30% { transform: translateY(0) scaleY(0.8); }
  50% { transform: translateY(-30px) scaleY(1.1); }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
@keyframes confettiFall {
  0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
@keyframes numberPop {
  0% { transform: scale(0) rotate(-10deg); }
  60% { transform: scale(1.3) rotate(5deg); }
  100% { transform: scale(1) rotate(0deg); }
}
@keyframes stomping {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(5px); }
}
@keyframes pointRight {
  0%, 100% { transform: rotate(0deg) translateX(0); }
  50% { transform: rotate(-15deg) translateX(10px); }
}

/* SVG Character Styles */
.boy-character, .girl-character {
  position: absolute;
  z-index: 50;
}
.boy-character.jumping { animation: jump 0.6s ease infinite; }
.boy-character.dancing { animation: dance 0.8s ease infinite; }
.boy-character.bouncing { animation: bounce 0.7s ease infinite; }
.boy-character.waving .boy-arm-right { animation: wave 0.5s ease infinite; }
.boy-character.stomping { animation: stomping 0.3s ease infinite; }

.girl-character.jumping { animation: jump 0.6s ease infinite; }
.girl-character.dancing { animation: dance 0.8s ease infinite; }
.girl-character.bouncing { animation: bounce 0.7s ease infinite; }
.girl-character.clapping { animation: clap 0.4s ease infinite; }
.girl-character.stomping { animation: stomping 0.3s ease infinite; }

.sun-character { animation: spin 20s linear infinite; }
.bird-wing { animation: flap 0.4s ease infinite; transform-origin: center; }
.star-character { animation: twinkle 1.5s ease infinite; }
.frog-character { animation: frogJump 1s ease infinite; }

.confetti-piece {
  position: absolute;
  width: 12px; height: 12px;
  animation: confettiFall 3s linear forwards;
  z-index: 100;
}

.number-char {
  display: inline-block;
  animation: numberPop 0.5s ease forwards;
  position: relative;
}
</style>
</head>
<body>
<div id="video-container">
  <div id="progress-bar"></div>
  
  <!-- Play Button -->
  <button id="play-btn" onclick="startVideo()">
    <svg width="50" height="50" viewBox="0 0 50 50">
      <polygon points="15,8 15,42 42,25" fill="white"/>
    </svg>
  </button>
  
  <!-- Replay Button -->
  <button id="replay-btn" onclick="replayVideo()">
    <svg width="50" height="50" viewBox="0 0 50 50">
      <path d="M25 8 A17 17 0 1 1 8 25" stroke="white" stroke-width="4" fill="none"/>
      <polygon points="8,17 8,33 16,25" fill="white"/>
    </svg>
  </button>

  <!-- Scenes will be injected by JS -->
  <div id="scenes-container"></div>
</div>

<script>

const SVG_SUN = `

  <circle cx="51" cy="53" r="1.5" fill="white"/>
  <circle cx="71" cy="53" r="1.5" fill="white"/>

  <path d="M48 68 Q60 78 72 68" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Cheeks -->

const SVG_BIRD = (color='#42A5F5', x=0, y=0, delay=0) => `
<svg width="60" height="40" viewBox="0 0 60 40" style="position:absolute;left:${x}px;top:${y}px;">
  <!-- Body -->
  <ellipse cx="30" cy="25" rx="15" ry="10" fill="${color}"/>

const SVG_STAR = (size=50) => `
<svg width="${size}" height="${size}" viewBox="0 0 50 50" class="star-character">
  <polygon points="25,2 31,18 49,18 35,28 39,46 25,36 11,46 15,28 1,18 19,18" fill="#FFD54F" stroke="#FFC107" stroke-width="1"/>

  <circle cx="30" cy="24" r="2" fill="#333"/>

const SVG_FROG = (x=0, y=0, delay=0) => `
<svg width="60" height="50" viewBox="0 0 60 50" class="frog-character" style="position:absolute;left:${x}px;top:${y}px;animation-delay:${delay}s">
  <!-- Body -->
  <ellipse cx="30" cy="35" rx="18" ry="14" fill="#66BB6A"/>
  <!-- Head -->
  <ellipse cx="30" cy="22" rx="16" ry="12" fill="#81C784"/>
  <!-- Eyes (big bulging) -->
  <circle cx="22" cy="14" r="8" fill="#A5D6A7"/>
  <circle cx="38" cy="14" r="8" fill="#A5D6A7"/>
  <circle cx="22" cy="14" r="5" fill="white"/>
  <circle cx="38" cy="14" r="5" fill="white"/>
  <circle cx="23" cy="13" r="3" fill="#333"/>
  <circle cx="39" cy="13" r="3" fill="#333"/>
  <!-- Smile -->
  <path d="M20 28 Q30 35 40 28" stroke="#2E7D32" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Legs -->
  <ellipse cx="14" cy="44" rx="8" ry="5" fill="#4CAF50"/>
  <ellipse cx="46" cy="44" rx="8" ry="5" fill="#4CAF50"/>
</svg>`;

const SVG_CLAPPING_HANDS = `
<svg width="100" height="80" viewBox="0 0 100 80">
  <!-- Left Hand -->
  <g class="clap-left" style="animation: clap 0.4s ease infinite;">
    <path d="M20 40 Q15 30 25 25 Q30 20 35 28 L40 40 Q35 50 25 48 Q18 46 20 40Z" fill="#FFCC80" stroke="#E6B56C" stroke-width="1"/>
    <line x1="28" y1="30" x2="30" y2="38" stroke="#E6B56C" stroke-width="1"/>
    <line x1="32" y1="28" x2="33" y2="37" stroke="#E6B56C" stroke-width="1"/>
  </g>
  <!-- Right Hand -->
  <g class="clap-right" style="animation: clap 0.4s ease infinite; animation-delay: 0.05s;">
    <path d="M80 40 Q85 30 75 25 Q70 20 65 28 L60 40 Q65 50 75 48 Q82 46 80 40Z" fill="#FFCC80" stroke="#E6B56C" stroke-width="1"/>
    <line x1="72" y1="30" x2="70" y2="38" stroke="#E6B56C" stroke-width="1"/>
    <line x1="68" y1="28" x2="67" y2="37" stroke="#E6B56C" stroke-width="1"/>
  </g>
  <!-- Clap sparkles -->
  <circle cx="50" cy="35" r="3" fill="#FFD54F" opacity="0.8"/>
  <circle cx="45" cy="28" r="2" fill="#FF8A65" opacity="0.6"/>
  <circle cx="55" cy="28" r="2" fill="#FF8A65" opacity="0.6"/>
</svg>`;

function createNumberWithEyes(num, color) {
  return `<span class="number-char" style="color:${color};position:relative;display:inline-block;margin:0 5px;">
    ${num}
    <svg width="30" height="15" viewBox="0 0 30 15" style="position:absolute;top:-5px;left:50%;transform:translateX(-50%);">
      <circle cx="10" cy="8" r="4" fill="white" stroke="#333" stroke-width="1"/>
      <circle cx="20" cy="8" r="4" fill="white" stroke="#333" stroke-width="1"/>
      <circle cx="11" cy="8" r="2" fill="#333"/>
      <circle cx="21" cy="8" r="2" fill="#333"/>
    </svg>
  </span>`;
}

function createConfetti(count=30) {
  const colors = ['#FF6B6B','#FFD93D','#6BCF7F','#4ECDC4','#A855F7','#FF8E53','#42A5F5','#EC407A'];
  const shapes = ['circle','square','triangle','diamond'];
  let html = '';
  for(let i=0; i<count; i++){
    const color = colors[Math.floor(Math.random()*colors.length)];
    const shape = shapes[Math.floor(Math.random()*shapes.length)];
    const left = Math.random()*100;
    const delay = Math.random()*2;
    const size = 8 + Math.random()*10;
    let shapeStyle = '';
    if(shape==='circle') shapeStyle = `border-radius:50%;`;
    else if(shape==='triangle') shapeStyle = `width:0;height:0;border-left:${size/2}px solid transparent;border-right:${size/2}px solid transparent;border-bottom:${size}px solid ${color};background:none;`;
    else if(shape==='diamond') shapeStyle = `transform:rotate(45deg);`;
    html += `<div class="confetti-piece" style="left:${left}%;animation-delay:${delay}s;width:${size}px;height:${size}px;background:${shape==='triangle'?'none':color};${shapeStyle}"></div>`;
  }
  return html;
}

// Scene definitions
const scenes = [
  // INTRO (0-12s)
  {
    duration: 3000,
    bg: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
    content: () => `
      <div class="scene-text large" style="animation:bounce 0.7s ease infinite;">Hey, hey! Are you ready?</div>
      <div class="boy-character waving" style="bottom:10%;left:15%;">${SVG_BOY(1.2)}</div>
      <div class="girl-character dancing" style="bottom:10%;right:15%;">${SVG_GIRL(1.2)}</div>
    `

  {

      <div class="boy-character waving" style="bottom:5%;left:10%;">${SVG_BOY(1)}</div>
      <div class="girl-character bouncing" style="bottom:5%;right:10%;">${SVG_GIRL(1)}</div>
    `
  },
  {
    duration: 3000,
    bg: 'linear-gradient(135deg, #f6d365 0%, #fda085 100%)',
    content: () => `
      <div class="number-display" style="animation:bounce 0.4s ease infinite;">${createNumberWithEyes('10','#FF1744')}</div>

// Video Controller
let currentScene = -1;
let timer = null;
let totalDuration = scenes.reduce((a,s) => a + s.duration, 0);
let elapsed = 0;
let progressInterval = null;

function startVideo() {
  document.getElementById('play-btn').style.display = 'none';
  document.getElementById('replay-btn').style.display = 'none';
  currentScene = -1;
  elapsed = 0;
  updateProgress();
  nextScene();
  progressInterval = setInterval(() => {
    elapsed += 100;
    updateProgress();
  }, 100);
}

function replayVideo() {
  startVideo();
}

function updateProgress() {
  const pct = Math.min((elapsed / totalDuration) * 100, 100);
  document.getElementById('progress-bar').style.width = pct + '%';
}

function nextScene() {
  currentScene++;
  if (currentScene >= scenes.length) {
    endVideo();
    return;
  }
  
  const container = document.getElementById('scenes-container');
  // Remove old scenes
  const oldScenes = container.querySelectorAll('.scene');
  oldScenes.forEach(s => s.classList.remove('active'));
  setTimeout(() => {
    oldScenes.forEach(s => s.remove());
  }, 600);
  
  const scene = scenes[currentScene];
  const div = document.createElement('div');
  div.className = 'scene active';
  div.style.background = scene.bg;
  div.innerHTML = scene.content();
  container.appendChild(div);
  
  // Trigger reflow then activate
  requestAnimationFrame(() => {
    div.classList.add('active');
  });
  
  timer = setTimeout(nextScene, scene.duration);
}

function endVideo() {
  clearInterval(progressInterval);
  document.getElementById('progress-bar').style.width = '100%';
  setTimeout(() => {
    document.getElementById('replay-btn').style.display = 'flex';
  }, 500);
}
</script>
